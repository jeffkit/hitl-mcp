[project]
name = "hitl-server"
version = "2.1.7"
description = "HITL Server - Human-in-the-Loop 服务端（个人端，iLink + WeCom AI）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kong Jie" },
]
keywords = ["hitl", "human-in-the-loop", "mcp", "wechat", "wecom", "ilink", "ai", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=12.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/jeffkit/hitl-mcp"
Repository = "https://github.com/jeffkit/hitl-mcp"
Issues = "https://github.com/jeffkit/hitl-mcp/issues"

[project.scripts]
hitl-server = "hitl_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitl_server"]

[tool.hatch.build.targets.sdist]
include = [
    "hitl_server",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.sdist.force-include]
"hitl_server/console/dist" = "hitl_server/console/dist"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
